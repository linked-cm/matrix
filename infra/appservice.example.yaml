# Serve appservice registration (plan 002 M0) — TEMPLATE.
# Real file (serve-appservice.yaml) is generated by gen-registration.sh and
# NEVER committed: as_token/hs_token are credentials. The homeserver mounts the
# generated file; the appservice reads the same tokens from its env.
id: serve-appservice
# The appservice endpoints are HOSTED IN THE SERVE APP BACKEND (M2 decision —
# it already owns graph access for age bands). The homeserver container
# reaches the host app via host.docker.internal (compose adds host-gateway
# for Linux). The serve app listens on 4010 in BOTH local dev and the box
# (override with APP_PORT at gen time). NOTE: the registration is DB-stored —
# changing this url requires `!admin appservices unregister serve-appservice`
# + re-register (bootstrap re-runs handle fresh volumes only).
url: http://host.docker.internal:__APP_PORT__
as_token: "__AS_TOKEN__"
hs_token: "__HS_TOKEN__"
# The bridge acts as @serve; @ally is the second bot identity.
sender_localpart: serve
rate_limited: false
namespaces:
  users:
    # Every Serve player MXID is appservice-managed (puppeted): opaque
    # derivation of the Player IRI, never PII (plan 002 §identity).
    - exclusive: true
      regex: "@p_.*:serve\\.create\\.now"
    - exclusive: true
      regex: "@ally:serve\\.create\\.now"
  aliases:
    # Team/mission/event rooms are provisioned under serve_* aliases so the
    # appservice owns the WP24 taxonomy end-to-end.
    - exclusive: true
      regex: "#serve_.*:serve\\.create\\.now"
  rooms: []
